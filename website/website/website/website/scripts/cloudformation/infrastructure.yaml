AWSTemplateFormatVersion: '2010-09-09' 
Description: Training VPC, EC2 Apache server, private versioned S3, IAM role and CPU alarm 
Parameters: 
 AmiId: 
 Type: AWS::EC2::Image::Id 
 Description: Current Amazon Linux 2023 AMI ID for this Region 
 InstanceType: 
 Type: String 
 Default: t3.micro 
 AllowedValues: [t2.micro, t3.micro, t3.small, t3a.micro] 
 MyIpCidr: 
 Type: String 
 Description: Your public IPv4 CIDR, e.g. 203.0.113.10/32 
 AllowedPattern: '^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])$' 
 NotificationEmail: 
 Type: String 
 StudentName: 
 Type: String 
 Default: Student 
Resources: 
 LabVpc: 
 Type: AWS::EC2::VPC 
 Properties: 
 CidrBlock: 10.20.0.0/16 
 EnableDnsSupport: true 
 EnableDnsHostnames: true 
 Tags: [{Key: Name, Value: aws-devops-lab-vpc}, {Key: Project, Value: aws-devops-assignment}]  LabInternetGateway: 
 Type: AWS::EC2::InternetGateway 
 AttachInternetGateway: 
 Type: AWS::EC2::VPCGatewayAttachment 
 Properties:
 VpcId: !Ref LabVpc 
 InternetGatewayId: !Ref LabInternetGateway 
 PublicSubnet: 
 Type: AWS::EC2::Subnet 
 Properties: 
 VpcId: !Ref LabVpc 
 CidrBlock: 10.20.1.0/24 
 MapPublicIpOnLaunch: true 
 AvailabilityZone: !Select [0, !GetAZs ''] 
 PublicRouteTable: 
 Type: AWS::EC2::RouteTable 
 Properties: 
 VpcId: !Ref LabVpc 
 DefaultPublicRoute: 
 Type: AWS::EC2::Route 
 DependsOn: AttachInternetGateway 
 Properties: 
 RouteTableId: !Ref PublicRouteTable 
 DestinationCidrBlock: 0.0.0.0/0 
 GatewayId: !Ref LabInternetGateway 
 PublicSubnetRouteTableAssociation: 
 Type: AWS::EC2::SubnetRouteTableAssociation 
 Properties: 
 SubnetId: !Ref PublicSubnet 
 RouteTableId: !Ref PublicRouteTable 
 WebSecurityGroup: 
 Type: AWS::EC2::SecurityGroup 
 Properties: 
 GroupDescription: Public HTTP; SSH only from student IP  VpcId: !Ref LabVpc 
 SecurityGroupIngress: 
 - IpProtocol: tcp 
 FromPort: 80 
 ToPort: 80 
 CidrIp: 0.0.0.0/0 
 - IpProtocol: tcp 
 FromPort: 22 
 ToPort: 22 
 CidrIp: !Ref MyIpCidr 
 LabBucket: 
 Type: AWS::S3::Bucket 
 Properties: 
 VersioningConfiguration: {Status: Enabled} 
 PublicAccessBlockConfiguration: 
 BlockPublicAcls: true 
 IgnorePublicAcls: true 
 BlockPublicPolicy: true 
 RestrictPublicBuckets: true 
 BucketEncryption: 
 ServerSideEncryptionConfiguration: 
 - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}  Tags: [{Key: Project, Value: aws-devops-assignment}]  Ec2Role: 
 Type: AWS::IAM::Role 
 Properties: 
 AssumeRolePolicyDocument: 
 Version: '2012-10-17' 
 Statement: 
 - Effect: Allow 
 Principal: {Service: ec2.amazonaws.com}  Action: sts:AssumeRole 
 Path: / 
 Ec2S3ReadPolicy: 
 Type: AWS::IAM::Policy 
 Properties: 
 PolicyName: LabBucketReadOnly 
 Roles: [!Ref Ec2Role] 
 PolicyDocument: 
 Version: '2012-10-17'
 Statement: 
 - Effect: Allow 
 Action: [s3:ListBucket] 
 Resource: !GetAtt LabBucket.Arn 
 - Effect: Allow 
 Action: [s3:GetObject] 
 Resource: !Sub '${LabBucket.Arn}/*' 
 Ec2InstanceProfile: 
 Type: AWS::IAM::InstanceProfile 
 Properties: 
 Path: / 
 Roles: [!Ref Ec2Role] 
 WebServer: 
 Type: AWS::EC2::Instance 
 DependsOn: DefaultPublicRoute 
 Properties: 
 ImageId: !Ref AmiId 
 InstanceType: !Ref InstanceType 
 IamInstanceProfile: !Ref Ec2InstanceProfile 
 NetworkInterfaces: 
 - DeviceIndex: '0' 
 AssociatePublicIpAddress: true 
 SubnetId: !Ref PublicSubnet 
 GroupSet: [!Ref WebSecurityGroup] 
 BlockDeviceMappings: 
 - DeviceName: /dev/xvda 
 Ebs: 
 VolumeSize: 8 
 VolumeType: gp3 
 Encrypted: true 
 DeleteOnTermination: true 
 UserData: 
 Fn::Base64: !Sub | 
 #!/bin/bash 
 set -euxo pipefail 
 dnf update -y 
 dnf install -y httpd 
 systemctl enable --now httpd 
 cat > /var/www/html/index.html <<'HTML' 
 <!doctype html><html lang="en"><head><meta charset="utf-8"><title>AWS DevOps</title></head>  <body><h1>Welcome to my AWS DevOps Assignment</h1> 
 <p>Student: ${StudentName}</p><p>Role: Junior DevOps Engineer</p> 
 <p>Module: Git, GitHub and AWS Cloud Infrastructure</p></body></html>  HTML 
 Tags: 
 - Key: Name 
 Value: aws-devops-lab-web 
 - Key: Project 
 Value: aws-devops-assignment 
 AlarmTopic: 
 Type: AWS::SNS::Topic 
 Properties: 
 DisplayName: AWS DevOps Lab Alarm 
 AlarmEmailSubscription: 
 Type: AWS::SNS::Subscription 
 Properties: 
 TopicArn: !Ref AlarmTopic 
 Protocol: email 
 Endpoint: !Ref NotificationEmail 
 HighCpuAlarm: 
 Type: AWS::CloudWatch::Alarm 
 Properties: 
 AlarmDescription: EC2 CPU average above 70 percent for 5 minutes 
 Namespace: AWS/EC2 
 MetricName: CPUUtilization 
 Dimensions: 
 - Name: InstanceId 
 Value: !Ref WebServer 
 Statistic: Average
 Period: 300 
 EvaluationPeriods: 1 
 DatapointsToAlarm: 1 
 Threshold: 70 
 ComparisonOperator: GreaterThanThreshold 
 TreatMissingData: notBreaching 
 AlarmActions: [!Ref AlarmTopic] 
 OKActions: [!Ref AlarmTopic] 
Outputs: 
 WebsiteURL: 
 Value: !Sub 'http://${WebServer.PublicIp}/' 
 InstanceId: 
 Value: !Ref WebServer 
 PublicIP: 
 Value: !GetAtt WebServer.PublicIp 
 BucketName: 
 Value: !Ref LabBucket 
 VpcId: 
 Value: !Ref LabVpc 
 SecurityGroupId: 
 Value: !Ref WebSecurityGroup 
 AlarmTopicArn: 
 Value: !Ref AlarmTopic 
